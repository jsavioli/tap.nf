<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tap NF</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09080e;
      --primary: #8b5cf6;
      --primary-glow: rgba(139, 92, 246, 0.35);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
    }

    .card {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .logo-badge {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, #7c3aed, #4c1d95);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 35px var(--primary-glow);
      position: relative;
    }

    .logo-badge svg {
      width: 38px;
      height: 38px;
      fill: none;
      stroke: #fff;
      stroke-width: 2.2;
    }

    .spinner {
      position: absolute;
      width: 86px;
      height: 86px;
      border-radius: 24px;
      border: 2px solid transparent;
      border-top-color: var(--primary);
      animation: spin 0.8s linear infinite;
    }

    h1 { font-size: 1.35rem; font-weight: 700; }
    h1 span {
      background: linear-gradient(135deg, #c4b5fd, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p { color: var(--text-muted); font-size: 0.9rem; }

    .error-box {
      display: none;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 0.88rem;
      max-width: 320px;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="card">
    <div style="position: relative; display: flex; align-items: center; justify-content: center;">
      <div class="spinner"></div>
      <div class="logo-badge">
        <svg viewBox="0 0 24 24">
          <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
          <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
          <path d="M4 4a16 16 0 0 1 16 16" stroke-dasharray="2 3"/>
        </svg>
      </div>
    </div>

    <div>
      <h1 id="title">Conectando <span>Tap NF</span></h1>
      <p id="status">Redirecionando em um instante...</p>
    </div>

    <div id="error-box" class="error-box"></div>
  </div>

  <script>
    // ⚠️ SUA URL REAL DO APPS SCRIPT JÁ CONFIGURADA:
    const API_URL = "https://script.google.com/macros/s/AKfycbwz13ls9Ssqi3tWon1kkWh3SGTmvPvvYbBw-vp7fUJU-7HE0E979ZGPD9OivyHeuZu8/exec";

    (async function init() {
      const params = new URLSearchParams(window.location.search);
      const tagId = params.get('id');

      if (!tagId) {
        showError("Nenhuma tag NFC identificada nesta aproximação.");
        return;
      }

      try {
        const response = await fetch(`${API_URL}?id=${encodeURIComponent(tagId)}`, { redirect: 'follow' });
        const data = await response.json();

        if (data && data.found) {
          const finalUrl = formatTargetUrl(data.tipo, data.destino);
          window.location.replace(finalUrl);
        } else {
          showError("Esta tag Tap NF ainda não foi cadastrada na planilha.");
        }
      } catch (err) {
        showError("Instabilidade de conexão. Aproxime novamente.");
      }
    })();

    function formatTargetUrl(tipo, destino) {
      destino = destino.trim();
      const tipoLower = (tipo || '').toLowerCase();

      if (tipoLower.includes('insta')) {
        const handle = destino.replace('@', '').replace('https://instagram.com/', '').replace('http://instagram.com/', '').replace('/', '');
        return `https://instagram.com/${handle}`;
      }

      if (tipoLower.includes('whats') || tipoLower.includes('zap')) {
        let phone = destino.replace(/\D/g, '');
        if (phone.length <= 11) phone = '55' + phone;
        return `https://wa.me/${phone}`;
      }

      if (!destino.startsWith('http://') && !destino.startsWith('https://')) {
        return 'https://' + destino;
      }
      return destino;
    }

    function showError(msg) {
      document.querySelector('.spinner').style.display = 'none';
      document.getElementById('status').style.display = 'none';
      document.getElementById('title').textContent = "Tap NF";
      const errEl = document.getElementById('error-box');
      errEl.textContent = msg;
      errEl.style.display = 'block';
    }
  </script>
</body>
</html>
