<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tap NF | Painel de Controle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0a10;
      --card-bg: #14121f;
      --card-border: #232035;
      --primary: #8b5cf6;
      --primary-hover: #7c3aed;
      --primary-soft: rgba(139, 92, 246, 0.15);
      --text: #f9fafb;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --danger-soft: rgba(239, 68, 68, 0.15);
      --radius: 14px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding: 24px 16px;
      min-height: 100vh;
    }

    /* Modal de Senha */
    #auth-overlay {
      position: fixed;
      inset: 0;
      background: rgba(11, 10, 16, 0.94);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .auth-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 32px;
      border-radius: var(--radius);
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 18px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #7c3aed, #4c1d95);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(124, 58, 237, 0.4);
    }
    .brand-icon svg { width: 22px; height: 22px; stroke: #fff; fill: none; stroke-width: 2.2; }
    .brand-text h1 { font-size: 1.35rem; font-weight: 700; }
    .brand-text p { font-size: 0.8rem; color: var(--text-muted); }

    .btn-logout {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .btn-logout:hover { border-color: var(--danger); color: var(--danger); }

    .grid {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 24px;
      align-items: start;
    }
    @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 24px;
    }
    .card-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 18px; }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }
    label { font-size: 0.82rem; font-weight: 600; color: var(--text-muted); }
    input, select {
      background: #0f0d18;
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
    }
    input:focus, select:focus { border-color: var(--primary); }

    button.btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: #fff;
      border: none;
      padding: 13px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }

    .filter-bar {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 12px;
      margin-bottom: 18px;
    }
    @media (max-width: 600px) { .filter-bar { grid-template-columns: 1fr; } }

    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.88rem; }
    th {
      color: var(--text-muted);
      font-weight: 600;
      padding: 12px 10px;
      border-bottom: 1px solid var(--card-border);
      font-size: 0.78rem;
      text-transform: uppercase;
    }
    td {
      padding: 14px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      vertical-align: middle;
    }

    .badge {
      display: inline-block;
      padding: 4px 9px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-google { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
    .badge-insta { background: rgba(236, 72, 153, 0.15); color: #f472b6; }
    .badge-whats { background: rgba(16, 185, 129, 0.15); color: #34d399; }

    /* Botões de Ações */
    .actions-cell {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: nowrap;
    }

    .btn-action {
      background: #1a1727;
      border: 1px solid var(--card-border);
      color: #c4b5fd;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }
    .btn-action:hover {
      background: var(--primary-soft);
      border-color: var(--primary);
    }

    /* Botão Lixeira */
    .btn-delete {
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: #f87171;
      padding: 6px 8px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .btn-delete:hover {
      background: var(--danger);
      color: #fff;
    }
    .btn-delete svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1a172a;
      border: 1px solid var(--primary);
      color: #fff;
      padding: 12px 20px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      font-size: 0.9rem;
      display: none;
      z-index: 1001;
    }
  </style>
</head>
<body>

  <!-- Modal de Senha -->
  <div id="auth-overlay">
    <div class="auth-box">
      <div class="brand-icon" style="margin: 0 auto 16px auto;">
        <svg viewBox="0 0 24 24"><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>
      </div>
      <h2 style="font-size: 1.2rem; margin-bottom: 6px;">Tap NF Admin</h2>
      <p style="font-size: 0.82rem; color: var(--text-muted); margin-bottom: 20px;">Digite a senha de administrador</p>
      
      <form id="authForm">
        <input type="password" id="adminPassword" placeholder="Sua senha..." style="width: 100%; margin-bottom: 12px; text-align: center;" required autofocus>
        <button type="submit" class="btn-primary">Entrar no Painel</button>
      </form>
    </div>
  </div>

  <div class="container">
    <header>
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/><path d="M4 4a16 16 0 0 1 16 16" stroke-dasharray="2 3"/></svg>
        </div>
        <div class="brand-text">
          <h1>Tap NF</h1>
          <p>Painel de Controle • Nova Friburgo - RJ</p>
        </div>
      </div>
      <button class="btn-logout" onclick="logout()">Encerrar Sessão</button>
    </header>

    <div class="grid">
      <div class="card">
        <h2 class="card-title">Nova Tag NFC</h2>
        <form id="tagForm">
          <div class="form-group">
            <label>Nome do Estabelecimento / Cliente</label>
            <input type="text" id="cliente" placeholder="Ex: Padaria Poppe" required>
          </div>

          <div class="form-group">
            <label>Tipo de Pilar</label>
            <select id="tipo" required onchange="adjustDestinationHelper()">
              <option value="Google Avaliações">Google Avaliações (5 Estrelas)</option>
              <option value="Instagram">Instagram</option>
              <option value="WhatsApp">WhatsApp</option>
            </select>
          </div>

          <div class="form-group">
            <label id="destLabel">Link de Avaliação Google Maps</label>
            <input type="text" id="destino" placeholder="https://g.page/r/..." required>
          </div>

          <div class="form-group">
            <label>ID da URL (NFC Slug)</label>
            <input type="text" id="idTag" placeholder="ex: poppe-google" required>
            <small style="color: var(--text-muted); font-size: 0.72rem; margin-top: 3px;">
              Link gravado na tag: <b id="previewFullUrl">...</b>
            </small>
          </div>

          <div class="form-group">
            <label>Bairro (Nova Friburgo)</label>
            <input list="bairrosList" id="bairro" placeholder="Selecione ou digite o bairro">
            <datalist id="bairrosList">
              <option value="Centro"><option value="Olaria"><option value="Cônego">
              <option value="Braunes"><option value="Cascata"><option value="Conselheiro Paulino">
              <option value="Duas Pedras"><option value="Ponte da Saudade"><option value="Mury">
              <option value="Amparo"><option value="Lumiar"><option value="São Pedro da Serra">
            </datalist>
          </div>

          <div class="form-group">
            <label>Contato do Responsável (WhatsApp)</label>
            <input type="text" id="contato" placeholder="22999998888">
          </div>

          <button type="submit" class="btn-primary" id="btnSubmit">Cadastrar Tag</button>
        </form>
      </div>

      <div class="card">
        <h2 class="card-title">Tags Ativas</h2>
        
        <div class="filter-bar">
          <input type="text" id="searchInput" placeholder="Buscar cliente ou ID..." oninput="filterTags()">
          <select id="filterTipo" onchange="filterTags()">
            <option value="">Todos os Tipos</option>
            <option value="Google">Google</option>
            <option value="Instagram">Instagram</option>
            <option value="WhatsApp">WhatsApp</option>
          </select>
          <select id="filterBairro" onchange="filterTags()">
            <option value="">Todos os Bairros</option>
          </select>
        </div>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Cliente / ID</th>
                <th>Pilar</th>
                <th>Bairro</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="tagsBody">
              <tr><td colspan="4" style="text-align: center; color: var(--text-muted);">Carregando tags...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwz13ls9Ssqi3tWon1kkWh3SGTmvPvvYbBw-vp7fUJU-7HE0E979ZGPD9OivyHeuZu8/exec";
    const SENHA_MESTRA = "tapnf2026";

    function getCleanBaseUrl() {
      let loc = window.location.href.split('?')[0].split('#')[0];
      let clean = loc.replace(/\/admin(\.html)?\/?$/i, '');
      if (!clean.endsWith('/')) clean += '/';
      return clean;
    }

    const BASE_URL = getCleanBaseUrl();
    let cachedTags = [];

    // Gerenciador de Senha
    window.addEventListener('DOMContentLoaded', () => {
      if (sessionStorage.getItem('tapnf_auth') === 'true') {
        document.getElementById('auth-overlay').style.display = 'none';
        fetchTags();
      }
      updatePreview();
    });

    document.getElementById('authForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const pass = document.getElementById('adminPassword').value;
      if (pass === SENHA_MESTRA) {
        sessionStorage.setItem('tapnf_auth', 'true');
        document.getElementById('auth-overlay').style.display = 'none';
        fetchTags();
      } else {
        showToast("Senha incorreta!");
        document.getElementById('adminPassword').value = '';
      }
    });

    function logout() {
      sessionStorage.removeItem('tapnf_auth');
      location.reload();
    }

    // Leitura das tags
    async function fetchTags() {
      try {
        const res = await fetch(`${API_URL}?action=getAll`, {
          method: 'GET',
          redirect: 'follow'
        });
        const text = await res.text();
        const data = JSON.parse(text);

        if (data.success) {
          cachedTags = data.tags || [];
          populateBairrosFilter(cachedTags);
          renderTable(cachedTags);
        } else {
          showToast(data.message || "Erro retornado pela planilha.");
        }
      } catch (err) {
        showToast("Erro ao carregar dados da planilha.");
      }
    }

    function renderTable(tags) {
      const tbody = document.getElementById('tagsBody');
      tbody.innerHTML = '';

      if (!tags.length) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: var(--text-muted);">Nenhuma tag encontrada.</td></tr>`;
        return;
      }

      tags.forEach(t => {
        const tr = document.createElement('tr');
        let badgeClass = 'badge-google';
        if (t.tipo.includes('Instagram')) badgeClass = 'badge-insta';
        if (t.tipo.includes('WhatsApp')) badgeClass = 'badge-whats';

        const finalNfcLink = `${BASE_URL}?id=${encodeURIComponent(t.id)}`;

        tr.innerHTML = `
          <td>
            <strong>${t.cliente || 'Sem nome'}</strong><br>
            <code style="color: var(--primary); font-size: 0.75rem;">${t.id}</code>
          </td>
          <td><span class="badge ${badgeClass}">${t.tipo}</span></td>
          <td><small style="color: var(--text-muted);">${t.bairro || 'N/A'}</small></td>
          <td>
            <div class="actions-cell">
              <button class="btn-action" onclick="copyNfcLink('${finalNfcLink}')">Copiar</button>
              <button class="btn-action" onclick="testNfcLink('${finalNfcLink}')">Testar</button>
              <button class="btn-delete" title="Excluir cliente" onclick="deleteTag('${t.id}', '${escapeHtml(t.cliente)}')">
                <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
              </button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // ==========================================
    // SOLUÇÃO DO WEBVIEW DO WEBINTOPAPP (.APK)
    // ==========================================
    function testNfcLink(url) {
      const isAndroid = /Android/i.test(navigator.userAgent);
      if (isAndroid) {
        // Dispara intent nativo para forçar a saída do WebView e abrir no Chrome
        const raw = url.replace(/^https?:\/\//, '');
        window.location.href = `intent://${raw}#Intent;scheme=https;action=android.intent.action.VIEW;end`;
      } else {
        window.open(url, '_blank');
      }
    }

    // ==========================================
    // FUNÇÃO DE EXCLUSÃO COM A LIXEIRINHA
    // ==========================================
    async function deleteTag(id, cliente) {
      if (!confirm(`Deseja realmente excluir a tag de "${cliente}" (${id})?\n\nEsta ação apagará a linha da sua planilha do Google.`)) {
        return;
      }

      showToast("Excluindo da planilha...");

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          redirect: 'follow',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'delete', id: id })
        });
        const result = await res.json();

        if (result.success) {
          showToast("Cliente excluído com sucesso!");
          fetchTags(); // Atualiza a tabela
        } else {
          showToast(result.message || "Erro ao excluir.");
        }
      } catch (err) {
        showToast("Erro ao comunicar exclusão com a planilha.");
      }
    }

    function escapeHtml(text) {
      return (text || '').replace(/'/g, "\\'");
    }

    // Slug Generator
    const clienteInput = document.getElementById('cliente');
    const tipoSelect = document.getElementById('tipo');
    const idTagInput = document.getElementById('idTag');
    const previewFullUrl = document.getElementById('previewFullUrl');

    function updatePreview() {
      const slug = idTagInput.value.trim() || 'slug';
      previewFullUrl.textContent = `${BASE_URL}?id=${slug}`;
    }

    function updateSlug() {
      const clientSlug = clienteInput.value.toLowerCase().replace(/[^a-z0-9]/g, '');
      let suffix = 'g';
      if (tipoSelect.value.includes('Instagram')) suffix = 'insta';
      if (tipoSelect.value.includes('WhatsApp')) suffix = 'zap';
      if (clientSlug) {
        idTagInput.value = `${clientSlug}-${suffix}`;
      }
      updatePreview();
    }

    clienteInput.addEventListener('input', updateSlug);
    idTagInput.addEventListener('input', updatePreview);

    function adjustDestinationHelper() {
      const tipo = tipoSelect.value;
      const label = document.getElementById('destLabel');
      const input = document.getElementById('destino');
      
      if (tipo === 'Google Avaliações') {
        label.textContent = "Link de Avaliação Google Maps";
        input.placeholder = "https://g.page/r/...";
      } else if (tipo === 'Instagram') {
        label.textContent = "Instagram (@ ou perfil)";
        input.placeholder = "@padariapoppe";
      } else {
        label.textContent = "WhatsApp (DDD + Número)";
        input.placeholder = "22999998888";
      }
      updateSlug();
    }

    // Salvar Tag
    document.getElementById('tagForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.textContent = "Salvando...";

      const payload = {
        id: idTagInput.value,
        cliente: clienteInput.value,
        tipo: tipoSelect.value,
        destino: document.getElementById('destino').value,
        bairro: document.getElementById('bairro').value,
        contato: document.getElementById('contato').value
      };

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          redirect: 'follow',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        const result = await res.json();
        
        if (result.success) {
          showToast("Tag cadastrada com sucesso!");
          document.getElementById('tagForm').reset();
          updatePreview();
          fetchTags();
        } else {
          showToast(result.message || "Erro retornado pela planilha.");
        }
      } catch (err) {
        showToast("Erro ao comunicar com a planilha.");
      } finally {
        btn.disabled = false;
        btn.textContent = "Cadastrar Tag";
      }
    });

    function filterTags() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const tipo = document.getElementById('filterTipo').value;
      const bairro = document.getElementById('filterBairro').value;

      const filtered = cachedTags.filter(t => {
        const matchesSearch = (t.cliente || '').toLowerCase().includes(search) || (t.id || '').toLowerCase().includes(search);
        const matchesTipo = !tipo || (t.tipo || '').includes(tipo);
        const matchesBairro = !bairro || (t.bairro || '') === bairro;
        return matchesSearch && matchesTipo && matchesBairro;
      });

      renderTable(filtered);
    }

    function populateBairrosFilter(tags) {
      const select = document.getElementById('filterBairro');
      const bairros = [...new Set(tags.map(t => t.bairro).filter(Boolean))];
      select.innerHTML = '<option value="">Todos os Bairros</option>';
      bairros.forEach(b => {
        select.innerHTML += `<option value="${b}">${b}</option>`;
      });
    }

    function copyNfcLink(url) {
      navigator.clipboard.writeText(url);
      showToast("Link NFC copiado!");
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }
  </script>
</body>
</html>
